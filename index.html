<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trường Tiếng Việt Của Em · Bài 1</title>
<meta name="description" content="7 trò chơi tương tác cho Bài 1: Bảng chữ cái, nguyên âm, phụ âm, mô hình tiếng, dấu thanh và các nét cơ bản.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Bố cục: một ứng dụng một cột — thanh thương hiệu cố định trên cùng, vùng chơi ở giữa, dòng bản quyền mờ dưới đáy.
   Nền giấy dó, chữ than chì, điểm nhấn vàng rơm / nâu gỗ, xanh lá nhạt và hồng đào làm màu phụ. */
:root{
  --paper:#F4F0EA; --paper-deep:#E9E0D2; --card:#FFFCF6; --line:#DCCFBC;
  --ink:#2A231F; --ink-soft:#64574C; --charcoal:#3A3B3C;
  --straw:#DDAA55; --straw-soft:#F6E3BC; --wood:#C68B59; --wood-deep:#8C5A32;
  --green:#DCEBCF; --green-ink:#3E7A3A; --peach:#F7D3C3; --peach-ink:#B4553C;
  --ok:#3E8E4A; --focus:#2F6FB0;
  --vowel:#F7E3B5; --cons:#D3E8C6;
  --onset:#D5E8BF; --onset-ink:#4A7A2A; --main:#F9CDD3; --main-ink:#B0334A; --coda:#F7E0A3; --coda-ink:#8F6210;
  --font-display:"Baloo 2","Nunito","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Nunito","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --shadow:0 2px 0 rgba(58,59,60,.10),0 10px 24px -14px rgba(58,59,60,.45);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background-color:var(--paper); color:var(--ink);
  background-image:radial-gradient(rgba(140,90,50,.06) 1px,transparent 1.3px),radial-gradient(rgba(140,90,50,.045) 1px,transparent 1.3px);
  background-size:23px 23px,37px 37px; background-position:0 0,11px 17px;
  font-family:var(--font-body); font-weight:600; font-size:17px; line-height:1.4;
  -webkit-tap-highlight-color:transparent; -webkit-text-size-adjust:100%;
}
button{font-family:inherit; color:inherit}
:focus-visible{outline:3px solid var(--focus); outline-offset:3px}
[hidden]{display:none!important}
.app{
  max-width:1180px; margin:0 auto; min-height:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(8px + env(safe-area-inset-top,0px)) calc(52px + env(safe-area-inset-bottom,0px));
}

/* ---------- Thanh thương hiệu ---------- */
.brandbar{display:flex; align-items:center; justify-content:space-between; gap:12px; padding-block:4px 10px}
.logo{display:flex; align-items:center; gap:8px; text-decoration:none; border-radius:14px}
.logo .logo-trau{width:44px; height:auto; flex:none}
.logo .logo-chu{height:56px; width:auto; display:block}
.lesson-tag{font:800 14px/1.1 var(--font-display); letter-spacing:.6px; text-transform:uppercase; color:var(--wood-deep); background:var(--straw-soft); border:2px solid var(--straw); border-radius:999px; padding:7px 12px; white-space:nowrap}
.copyright{
  position:fixed; left:0; right:0; bottom:0; z-index:80; pointer-events:none; text-align:center;
  font-size:12.5px; font-weight:700; letter-spacing:.2px; color:var(--ink-soft); opacity:.5;
  padding-block:6px calc(6px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
}

/* ---------- Nút ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:54px; padding:12px 24px;
  font:800 19px/1 var(--font-body); color:var(--charcoal); background:var(--straw);
  border:3px solid var(--charcoal); border-radius:999px; box-shadow:0 4px 0 var(--charcoal); cursor:pointer;
  transition:transform .08s, box-shadow .08s;
}
.btn:active{transform:translateY(3px); box-shadow:0 1px 0 var(--charcoal)}
.btn.ghost{background:var(--card)}
.btn.small{min-height:44px; padding:8px 16px; font-size:16px; border-width:2.5px; box-shadow:0 3px 0 var(--charcoal)}
.btn[disabled]{opacity:.45; cursor:default}

/* ---------- Trâu Con ---------- */
/* Trâu Con là ảnh gốc của trường: chỉ chuyển động cả hình, không kéo giãn hay đổi tỉ lệ */
.trau{display:block; width:100%; height:auto; transform-origin:50% 100%; user-select:none; -webkit-user-select:none; -webkit-user-drag:none; pointer-events:none}
.trau.wave{animation:wave 1.6s ease-in-out infinite}
.trau.bob{animation:bob 3.2s ease-in-out infinite}
.trau.nod{animation:nod .45s ease-in-out 2}
.trau.tilt{animation:tilt .7s ease-in-out}
@keyframes wave{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg) translateY(-3px)}75%{transform:rotate(4deg) translateY(-3px)}}
@keyframes bob{50%{transform:translateY(-5px)}}
@keyframes nod{50%{transform:translateY(5px) scale(1.03,.97)}}
@keyframes tilt{30%{transform:rotate(-7deg)}70%{transform:rotate(5deg)}}
.pic img,.choice img,.target .mini img{width:100%; height:100%; object-fit:contain}

.bubble{
  position:relative; min-width:0; background:var(--card); border:2.5px solid var(--straw); border-radius:20px;
  padding:12px 16px; color:var(--ink); box-shadow:var(--shadow); font-weight:700;
}
.bubble::before{
  content:""; position:absolute; left:-11px; top:50%; width:18px; height:18px; background:var(--card);
  border-left:2.5px solid var(--straw); border-bottom:2.5px solid var(--straw); transform:translateY(-50%) rotate(45deg);
}
.bubble small{display:block; margin-top:4px; font-size:13px; font-weight:700; color:var(--ink-soft)}
.bubble.talk{display:flex; align-items:center; gap:12px}
.bubble.talk > span{flex:1; min-width:0}
.say-btn{flex:none; display:grid; place-items:center; width:54px; height:54px; padding:0; border-radius:50%; background:var(--straw); border:3px solid var(--charcoal); box-shadow:0 3px 0 var(--charcoal); cursor:pointer}
.say-btn svg{width:28px; height:28px}
.say-btn:active{transform:translateY(2px); box-shadow:0 1px 0 var(--charcoal)}
.say-btn.speaking{animation:ring 1s ease-in-out infinite}
@keyframes ring{50%{box-shadow:0 3px 0 var(--charcoal),0 0 0 7px rgba(221,170,85,.45)}}
.sound-help{position:fixed; z-index:70; left:max(16px,env(safe-area-inset-left,0px)); right:max(16px,env(safe-area-inset-right,0px)); top:calc(6px + env(safe-area-inset-top,0px)); max-width:640px; margin:0 auto; display:flex; align-items:center; gap:12px; font-size:15px; font-weight:700; line-height:1.35; color:var(--peach-ink); background:var(--peach); border:2.5px solid var(--peach-ink); border-radius:16px; padding:10px 12px 10px 16px; box-shadow:var(--shadow)}
.sound-help span{flex:1; min-width:0}

/* ---------- Trang chủ ---------- */
.hero{display:grid; grid-template-columns:minmax(150px,240px) minmax(0,1fr); gap:clamp(12px,3vw,32px); align-items:center; padding-block:6px 18px}
.hero-trau{max-width:240px; width:100%}
.eyebrow{margin:0 0 4px; font:800 13.5px/1.2 var(--font-display); letter-spacing:.8px; text-transform:uppercase; color:var(--wood-deep)}
.hero h1{margin:0 0 14px; font:800 clamp(30px,5vw,50px)/1.05 var(--font-display); color:var(--charcoal); text-wrap:balance}
.hero .bubble{font-size:19px; line-height:1.4; max-width:560px}
.hero-actions{display:flex; flex-wrap:wrap; gap:12px; margin-top:16px}
.check{margin:0 0 16px; max-width:680px; background:var(--card); border:2.5px solid var(--line); border-radius:18px; padding:12px 16px; font-size:15.5px}
.check ul{margin:0; padding:0; list-style:none; display:grid; gap:6px}
.check ul li{display:flex; gap:8px; align-items:baseline}
.check .k{flex:none; width:1.4em; text-align:center; font-weight:900}
.check .ok{color:var(--ok)} .check .bad{color:var(--peach-ink)} .check .wait{color:var(--ink-soft)}
.check ol{margin:10px 0 0; padding-left:1.3em; color:var(--ink); display:grid; gap:4px}
.check h3{margin:12px 0 0; font:800 16px/1.2 var(--font-display); color:var(--charcoal)}
.hero-actions{align-items:center}
.voice-note{margin:12px 0 0; max-width:560px; font-size:14.5px; color:var(--peach-ink); background:var(--peach); border-radius:14px; padding:10px 14px}
.menu-title{margin:8px 0 12px; font:800 24px/1.1 var(--font-display); color:var(--charcoal)}
.cards{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px}
.cards .gcard:last-child{grid-column:1 / -1}
@media (max-width:860px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.cards{grid-template-columns:1fr}}
.gcard{
  position:relative; display:grid; grid-template-columns:64px minmax(0,1fr); grid-template-rows:auto auto 1fr; column-gap:14px; row-gap:2px;
  text-align:left; padding:14px 16px 14px 14px; background:var(--card); border:3px solid var(--charcoal); border-radius:22px;
  box-shadow:0 4px 0 var(--charcoal); cursor:pointer; transition:transform .1s, box-shadow .1s;
}
.gcard:hover{transform:translateY(-2px); box-shadow:0 6px 0 var(--charcoal)}
.gcard:active{transform:translateY(3px); box-shadow:0 1px 0 var(--charcoal)}
.gcard .gicon{grid-row:1 / span 3; width:64px; height:64px; border-radius:16px; background:var(--straw-soft); display:grid; place-items:center; padding:6px}
.gcard .gicon svg{width:100%; height:100%}
.gcard .gnum{font:800 12.5px/1.2 var(--font-display); letter-spacing:.8px; text-transform:uppercase; color:var(--wood-deep)}
.gcard .gname{font:800 20px/1.15 var(--font-display); color:var(--charcoal)}
.gcard .gdesc{font-size:14.5px; line-height:1.35; color:var(--ink-soft); font-weight:700}
.gcard .gstars{position:absolute; top:10px; right:14px; font-size:15px; letter-spacing:1px; color:var(--straw)}
.gcard .gstars .off{color:var(--line)}

/* ---------- Khung trò chơi ---------- */
.ghead{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:8px}
.gtitle{flex:1; min-width:180px}
.gtitle h2{margin:0; font:800 clamp(24px,3.6vw,34px)/1.05 var(--font-display); color:var(--charcoal); text-wrap:balance}
.gprog{font:800 17px/1 var(--font-display); color:var(--charcoal); background:var(--card); border:2.5px solid var(--line); border-radius:999px; padding:9px 14px; white-space:nowrap; font-variant-numeric:tabular-nums}
.guide{display:flex; align-items:center; gap:16px; margin-block:6px 12px}
.guide-trau{flex:none; width:78px; padding:0; border:0; background:none; cursor:pointer; border-radius:18px}
.guide .bubble{flex:1; font-size:17.5px; line-height:1.4}
.levels{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px}
.chip{min-height:42px; padding:8px 15px; font:800 15.5px/1.1 var(--font-body); background:var(--card); color:var(--ink); border:2.5px solid var(--line); border-radius:999px; cursor:pointer}
.chip[aria-pressed="true"]{background:var(--charcoal); color:var(--paper); border-color:var(--charcoal)}
.stage{position:relative}
.screen{animation:enter .35s ease-out}
@keyframes enter{from{opacity:.4; transform:translateY(8px)}}

/* ---------- Thẻ chữ, vùng thả, phản hồi ---------- */
.tile{
  --t:66px; position:relative; width:var(--t); height:var(--t); display:grid; place-items:center;
  font:900 calc(var(--t)*.56)/1 var(--font-body); color:var(--ink); background:var(--card);
  border:3px solid var(--charcoal); border-radius:18px; box-shadow:0 4px 0 var(--charcoal);
  cursor:grab; user-select:none; -webkit-user-select:none; touch-action:none; padding:0;
}
.tile.dragging,.tcard.dragging,.lchip.dragging{z-index:100; cursor:grabbing; box-shadow:0 14px 24px -8px rgba(0,0,0,.35); transition:none}
.selected{outline:4px solid var(--straw)!important; outline-offset:3px}
.zone.over{outline:4px dashed var(--charcoal); outline-offset:5px}
.shake{animation:shake .45s}
@keyframes shake{10%,90%{translate:-2px 0}20%,80%{translate:4px 0}30%,50%,70%{translate:-7px 0}40%,60%{translate:7px 0}}
.pop-ok{animation:pop .5s}
@keyframes pop{40%{scale:1.14}}
.hint-pulse{animation:hint 1s ease-in-out 3}
@keyframes hint{50%{box-shadow:0 0 0 9px rgba(221,170,85,.6)}}
.dots{display:flex; flex-wrap:wrap; gap:7px; justify-content:center}
.dot{width:13px; height:13px; border-radius:50%; background:var(--line)}
.dot.cur{background:var(--straw); box-shadow:0 0 0 3px var(--straw-soft)}
.dot.done{background:var(--ok)}
.note{display:flex; gap:10px; align-items:flex-start; background:var(--green); color:var(--green-ink); border-radius:16px; padding:10px 14px; font-weight:800; font-size:15.5px}
.note b{white-space:nowrap}

/* ---------- 1. Thơ Lên Sáu ---------- */
.poem{
  max-width:720px; margin:0 auto; background:var(--card); border:3px solid var(--wood); border-radius:26px;
  outline:2px solid var(--straw); outline-offset:-11px; padding:24px clamp(14px,4vw,34px); box-shadow:var(--shadow);
}
.poem-head{display:block; margin:0 auto; padding:4px 12px; border:0; background:none; cursor:pointer; text-align:center; border-radius:14px}
.poem-head strong{display:block; font:800 clamp(34px,6vw,46px)/1 var(--font-display); color:var(--wood-deep); letter-spacing:1px}
.poem-head span{display:block; font-weight:800; color:var(--ink-soft); margin-top:4px}
.poem-cols{display:grid; grid-template-columns:1fr 1fr; gap:2px 28px; margin-top:12px}
.pline{display:block; width:100%; padding:6px 8px; border:0; border-radius:12px; background:transparent; cursor:pointer; text-align:center; font:700 clamp(21px,3vw,25px)/1.3 var(--font-body); color:var(--ink)}
.pline:hover,.pline.reading{background:var(--straw-soft)}
.poem-hint{text-align:center; color:var(--ink-soft); margin:14px 0 0; font-size:15px}
.qline{display:block; margin:0 auto 18px; padding:12px 22px; max-width:100%; font:800 clamp(28px,6vw,40px)/1.2 var(--font-body); color:var(--ink); background:var(--card); border:3px solid var(--straw); border-radius:20px; cursor:pointer}
.choices{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:clamp(10px,2vw,18px); max-width:640px; margin:0 auto 16px}
.choice{aspect-ratio:1; max-width:100%; padding:10px; background:var(--card); border:3px solid var(--charcoal); border-radius:22px; box-shadow:0 4px 0 var(--charcoal); cursor:pointer}
.choice svg{width:100%; height:100%}
.choice.right{background:var(--green); border-color:var(--ok); box-shadow:0 4px 0 var(--ok)}
.order{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:18px; max-width:820px; margin:0 auto}
.slots{display:grid; gap:9px; counter-reset:s}
.slot-line{display:flex; align-items:center; gap:10px; min-height:54px; padding:6px 12px; border:2.5px dashed var(--wood); border-radius:16px; background:rgba(255,252,246,.6); font:800 20px/1.2 var(--font-body); color:var(--ink); text-align:left; cursor:pointer}
.slot-line::before{counter-increment:s; content:counter(s); flex:none; display:grid; place-items:center; width:28px; height:28px; border-radius:50%; background:var(--straw); color:var(--charcoal); font:800 15px/1 var(--font-display)}
.slot-line.filled{border-style:solid; border-color:var(--ok); background:var(--green)}
.pool{display:flex; flex-direction:column; gap:10px}
.lchip{position:relative; display:block; width:100%; min-height:54px; padding:10px 16px; text-align:left; font:800 20px/1.2 var(--font-body); color:var(--ink); background:var(--card); border:3px solid var(--charcoal); border-radius:16px; box-shadow:0 4px 0 var(--charcoal); touch-action:none; user-select:none; -webkit-user-select:none; cursor:grab}

/* ---------- 2. Chuyến tàu chữ cái ---------- */
.trains{display:grid; gap:14px}
.train{display:flex; align-items:center; gap:10px; padding:10px 12px; border:3px solid var(--charcoal); border-radius:24px; cursor:pointer; overflow:hidden; box-shadow:var(--shadow)}
.train.vowel{background:var(--vowel)}
.train.cons{background:var(--cons)}
.train .ride{display:flex; align-items:center; gap:10px; width:100%; min-width:0}
.loco{flex:none; width:104px; display:flex; flex-direction:column; align-items:center; gap:2px; text-align:center; font:800 14px/1.1 var(--font-display); color:var(--charcoal)}
.loco svg{width:92px; height:auto}
.seats{flex:1; min-width:0; display:grid; grid-template-columns:repeat(auto-fill,minmax(42px,1fr)); gap:6px}
.seat{aspect-ratio:1; display:grid; place-items:center; border:2px dashed rgba(58,59,60,.32); border-radius:11px; background:rgba(255,255,255,.55); font:900 23px/1 var(--font-body); color:var(--ink)}
.seat.filled{border:2.5px solid var(--charcoal); background:var(--card)}
.train.leave .ride{animation:leave 1.7s ease-in forwards}
@keyframes leave{20%{transform:translateX(-14px)}100%{transform:translateX(115%)}}
.platform{display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:12px; min-height:104px; padding:16px; border-radius:20px; border:2.5px solid var(--line); background:repeating-linear-gradient(90deg,#EDE5D8 0 22px,#E5DACA 22px 44px)}
.platform-empty{color:var(--ink-soft); font-weight:800}

/* ---------- 3. Tìm bạn cho chữ ---------- */
.pairs-top{display:flex; justify-content:center; margin-bottom:12px}
.pairs{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; max-width:600px; margin:0 auto}
.pcard{position:relative; aspect-ratio:1/1.08; padding:0; font:900 clamp(36px,9vw,58px)/1 var(--font-body); color:var(--ink); background:var(--card); border:3px solid var(--charcoal); border-radius:20px; box-shadow:0 4px 0 var(--charcoal); cursor:pointer; transition:background .2s}
.pcard.sel{background:var(--straw-soft)}
.pcard.matched{background:var(--green); border-color:var(--ok); box-shadow:0 4px 0 var(--ok); color:var(--green-ink); cursor:default}
.pcard.down{color:transparent; background:var(--straw) repeating-linear-gradient(135deg,rgba(156,112,52,.25) 0 6px,transparent 6px 14px)}
.pcard.down::after{content:""; position:absolute; inset:28%; border-radius:50%; background:var(--card); opacity:.55}

/* ---------- 4. Chữ trốn ở đâu ---------- */
.hide{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.25fr); gap:22px; align-items:center; max-width:900px; margin:0 auto}
.pic{display:grid; place-items:center; width:100%; max-width:300px; aspect-ratio:1; margin:0 auto; padding:16px; background:var(--card); border:3px solid var(--charcoal); border-radius:26px; box-shadow:var(--shadow); cursor:pointer}
.pic svg{width:100%; height:100%}
.hide-right{display:grid; gap:16px; justify-items:center}
.word{display:flex; flex-wrap:wrap; justify-content:center; gap:10px}
.word .gap{width:26px}
.word .tile{--t:78px; cursor:pointer}
.tile.found-v{background:var(--vowel); border-color:var(--wood-deep)}
.tile.found-c{background:var(--cons); border-color:var(--green-ink)}
.find-count{font:800 21px/1.2 var(--font-display); color:var(--charcoal); text-align:center}

/* ---------- 5. Xây nhà cho tiếng ---------- */
.build{display:grid; gap:14px; justify-items:center; max-width:720px; margin:0 auto}
.target{display:flex; align-items:center; gap:16px; padding:8px 18px 8px 8px; background:var(--card); border:3px solid var(--charcoal); border-radius:24px; cursor:pointer; box-shadow:var(--shadow)}
.target .mini{width:84px; height:84px; flex:none}
.target .mini svg{width:100%; height:100%}
.target .big{font:900 clamp(46px,9vw,64px)/1 var(--font-body); color:var(--ink)}
.house{width:100%; max-width:640px}
.roof{position:relative; height:clamp(84px,14vw,110px); display:grid; place-items:end center; padding-bottom:10px}
.roof::before{content:""; position:absolute; inset:0 -4%; background:var(--wood); clip-path:polygon(50% 0,100% 100%,0 100%)}
.roof::after{content:""; position:absolute; inset:9px 7% 0; background:repeating-linear-gradient(0deg,rgba(255,255,255,.14) 0 8px,transparent 8px 16px); clip-path:polygon(50% 0,100% 100%,0 100%)}
.roof-slot{position:relative; z-index:1; display:flex; align-items:center; justify-content:center; gap:6px; min-width:132px; min-height:50px; padding:4px 12px; background:var(--card); border:2.5px dashed var(--charcoal); border-radius:14px; font:800 16px/1.1 var(--font-body); color:var(--ink-soft); cursor:pointer}
.roof-slot svg{width:30px; height:30px}
.roof-slot.filled{border-style:solid; color:var(--ink); background:var(--straw-soft)}
.rooms{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); border:3px solid var(--charcoal); border-top-width:4px; border-radius:0 0 18px 18px; overflow:hidden; background:var(--card)}
.room{display:flex; flex-direction:column; align-items:center; gap:4px; padding:10px 6px 12px; min-height:150px; cursor:pointer; text-align:center}
.room + .room{border-left:3px solid var(--charcoal)}

.room .slot.filled{border-style:solid; background:var(--card)}

.syl .vow.right{border-style:solid; border-color:var(--ok); background:var(--green)}

.trace{display:grid; gap:12px; justify-items:center}

/* =====================================================================
   KÉO – THẢ BẰNG POINTER EVENTS (chuột, ngón tay, bút) + chạm để chọn rồi chạm chỗ đặt
   ===================================================================== */
function zoneAt(zones, x, y) {
  for (const z of zones) {
    if (!z || !z.isConnected) continue;
    const r = z.getBoundingClientRect(), pad = 14;
    if (x >= r.left - pad && x <= r.right + pad && y >= r.top - pad && y <= r.bottom + pad) return z;
  }
  return null;
}
function draggable(el, o) {
  let st = null;
  el.addEventListener('pointerdown', e => {
    if (el.classList.contains('locked') || (e.pointerType === 'mouse' && e.button !== 0)) return;
    App.unlockAudio();
    st = { id: e.pointerId, x: e.clientX, y: e.clientY, moved: false, over: null };
    try { el.setPointerCapture(e.pointerId); } catch (_) {}
    if (o.onPick) o.onPick(el);
  });
  el.addEventListener('pointermove', e => {
    if (!st || e.pointerId !== st.id) return;
    const dx = e.clientX - st.x, dy = e.clientY - st.y;
    if (!st.moved && Math.hypot(dx, dy) > 9) { st.moved = true; el.classList.add('dragging'); }
    if (!st.moved) return;
    el.style.transform = `translate(${dx}px, ${dy}px) scale(1.06)`;
    const z = zoneAt(o.zones(), e.clientX, e.clientY);
    if (z !== st.over) { if (st.over) st.over.classList.remove('over'); st.over = z; if (z) z.classList.add('over'); }
  });
  const end = (e, cancel) => {
    if (!st || e.pointerId !== st.id) return;
    const s = st; st = null; el._lastPointer = performance.now();
    if (s.over) s.over.classList.remove('over');
    if (!s.moved) { if (!cancel && o.onTap) o.onTap(el); return; }
    el.classList.remove('dragging');
    const z = cancel ? null : zoneAt(o.zones(), e.clientX, e.clientY);
    const ok = z ? o.onDrop(el, z) : false;
    if (!ok && el.isConnected) {
      el.style.transition = 'transform .22s ease'; el.style.transform = '';
      setTimeout(() => { el.style.transition = ''; }, 240);
    } else el.style.transform = '';
  };
  el.addEventListener('pointerup', e => end(e, false));
  el.addEventListener('pointercancel', e => end(e, true));
  el.addEventListener('click', () => { // bàn phím (Enter/Space)
    if (el._lastPointer && performance.now() - el._lastPointer < 700) return;
    if (o.onPick) o.onPick(el); if (o.onTap) o.onTap(el);
  });
}
function Picker() {
  let sel = null;
  return {
    get: () => (sel && sel.isConnected ? sel : null),
    toggle(el) { if (sel === el) { el.classList.remove('selected'); sel = null; } else { if (sel) sel.classList.remove('selected'); sel = el; el.classList.add('selected'); } },
    clear() { if (sel) sel.classList.remove('selected'); sel = null; }
  };
}
function asZone(el, picker, tryDrop) {
  el.classList.add('zone');
  el.addEventListener('click', e => { if (e.target.closest('.tile,.tcard,.lchip')) return; const s = picker.get(); if (s) tryDrop(s, el); });
  if (el.tagName !== 'BUTTON') {
    el.tabIndex = 0; el.setAttribute('role', 'button');
    el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); el.click(); } });
  }
  return el;
}

const UI = {
  mistakes: 0, guideIds: [],

  guide(ids, silent) {
    this.guideIds = [].concat(ids);
    if (App.welcomeNext) { App.welcomeNext = false; this.guideIds = ['s:welcome', ...this.guideIds]; }
    $('#guideText').textContent = Speech.textOf(this.guideIds);
    if (!silent) Speech.say(this.guideIds);
  },
  progress(t) { $('#gProg').textContent = t; $('#gProg').hidden = !t; },
  mascot(cls) { const s = $('#guideTrau .trau'); if (!s) return; s.classList.remove('nod', 'tilt'); void s.getBoundingClientRect(); s.classList.add(cls); setTimeout(() => s.classList.remove(cls), 1000); },
  ok(els, sayIds) { Sfx.ok(); [].concat(els || []).forEach(e => bounce(e, 'pop-ok')); this.mascot('nod'); if (sayIds !== null) Speech.say(sayIds || [pick(PRAISE)]); },
  no(els, sayIds) { this.mistakes++; Sfx.no(); [].concat(els || []).forEach(e => bounce(e, 'shake')); this.mascot('tilt'); Speech.say(sayIds || [pick(RETRY)]); },
  hint(el) { bounce(el, 'hint-pulse', 3100); },
  finish(total, text) {
    const ratio = this.mistakes / Math.max(1, total);
    const stars = ratio <= 0.15 ? 3 : ratio <= 0.5 ? 2 : 1;
    const best = Store.get('stars', {});
    if ((best[Runner.id] || 0) < stars) { best[Runner.id] = stars; Store.set('stars', best); }
    const g = GAMES[Runner.id];
    $('#finStars').innerHTML = '★'.repeat(stars) + '<span class="off">' + '★'.repeat(3 - stars) + '</span>';
    $('#finStars').setAttribute('aria-label', stars + ' trên 3 sao');
    $('#finText').textContent = text || '';
    const hasNextLevel = g.chain && Runner.level < g.levels.length - 1;
    const nextGame = GAME_ORDER[GAME_ORDER.indexOf(Runner.id) + 1];
    const nb = $('#finNext');
    if (hasNextLevel) { nb.textContent = 'Vòng tiếp theo ›'; nb.onclick = () => { App.closeFinish(); Runner.open(Runner.id, Runner.level + 1); }; }
    else if (nextGame) { nb.textContent = 'Trò chơi tiếp theo ›'; nb.onclick = () => { App.closeFinish(); App.go(nextGame); }; }
    else { nb.textContent = 'Về trang chính'; nb.onclick = () => { App.closeFinish(); App.go(''); }; }
    $('#finAgain').onclick = () => { App.closeFinish(); Runner.open(Runner.id, Runner.level); };
    $('#finHome').onclick = () => { App.closeFinish(); App.go(''); };
    $('#finish').hidden = false; nb.focus({ preventScroll: true });
    Sfx.win(); Speech.say(['s:finish']);
  }
};
const Runner = {
  id: null, level: 0, timers: [],
  clear() { this.timers.forEach(clearTimeout); this.timers = []; Speech.stop(); },
  open(id, level = 0) {
    const g = GAMES[id]; if (!g) return;
    this.clear(); this.id = id; this.level = Math.min(Math.max(0, level), Math.max(0, g.levels.length - 1));
    UI.mistakes = 0;
    $('#home').hidden = true; $('#game').hidden = false; $('#finish').hidden = true;
    $('#gEyebrow').textContent = 'Trò chơi ' + g.num + ' / 7';
    $('#gTitle').textContent = g.title;
    document.title = g.title + ' · Trường Tiếng Việt Của Em';
    const lv = $('#gLevels'); lv.replaceChildren(); lv.hidden = g.levels.length < 2;
    g.levels.forEach((name, i) => lv.append(h('button', { class: 'chip', type: 'button', 'aria-pressed': String(i === this.level), onclick: () => { App.unlockAudio(); this.open(id, i); } }, name)));
    UI.progress('');
    UI.stage.replaceChildren();
    try { history.replaceState(null, '', '#' + id + (this.level ? '-' + this.level : '')); } catch (e) {}
    g.start(this.level);
    window.scrollTo({ top: 0 });
  }
};

    };
    const win = () => {
      st.done = true; st.drawing = false; doneSet.add(cur); chips[cur].classList.add('done');
      UI.progress(doneSet.size + ' / ' + S.length); draw();
      UI.ok(chips[cur], [pick(PRAISE), 'n:' + S[cur].id]);
      const k = cur; later(() => { if (cur === k) next(); }, 2200);
    };
    canvas.addEventListener('pointerdown', e => {
      if (!st || st.done) return;
      e.preventDefault(); App.unlockAudio();
      const p = local(e), v = view(), s = S[cur];
      const target = P(s.pts[Math.min(st.progress, s.pts.length - 1)], v);
      if (Math.hypot(target.x - p.x, target.y - p.y) > v.tol * 1.8) { say(st.progress ? 's:g7-off' : 's:g7-start'); return; }
      try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
      st.drawing = true; st.off = false; st.ink.push([p]); advance(p); draw();
    });
    canvas.addEventListener('pointermove', e => {
      if (!st || !st.drawing) return;
      const p = local(e); st.ink[st.ink.length - 1].push(p); advance(p); draw();
    });
    const up = () => { if (st) st.drawing = false; };
    canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);
    if ('ResizeObserver' in window) new ResizeObserver(resize).observe(canvas); else window.addEventListener('resize', resize);
    go(0);
  }
};

/* =====================================================================
   ỨNG DỤNG: trang chính, điều hướng, mở khóa âm thanh
   ===================================================================== */
const App = {
  audioReady: false, welcomeNext: false,
  soundCheck() {
    this.unlockAudio();
    const panel = $('#checkPanel'); panel.hidden = false;
    const chime = new Audio(CHIME_WAV); const p = chime.play(); if (p) p.catch(() => {});
    Speech.say(['s:check']);
    const row = (cls, mark, text) => `<li><span class="k ${cls}">${mark}</span><span>${text}</span></li>`;
    const render = done => {
      const voiceLine = !Speech.supported ? row('bad', '✗', 'Trình duyệt này không có chức năng đọc tiếng.')
        : !Speech.voicesKnown ? (done ? row('bad', '✗', 'Không tìm thấy giọng đọc tiếng Việt trên máy.') : row('wait', '…', 'Đang tìm giọng đọc tiếng Việt trên máy…'))
        : Speech.hasVi ? row('ok', '✓', 'Máy có giọng đọc tiếng Việt: ' + (Speech.voiceName || 'tiếng Việt') + '.')
        : row('bad', '✗', 'Máy chưa có giọng đọc tiếng Việt.');
      const spoke = Speech.heard ? row('ok', '✓', 'Trâu Con đã nói. Nếu vẫn không nghe thấy, hãy tăng âm lượng và tắt chế độ Im lặng.')
        : done ? row('bad', '✗', 'Trâu Con chưa phát ra tiếng.') : row('wait', '…', 'Trâu Con đang thử nói…');
      panel.innerHTML = '<ul>' + row('wait', '♪', 'Vừa phát một tiếng “ting ting”. Nếu nghe thấy tiếng này mà không nghe Trâu Con nói, lỗi nằm ở giọng đọc của máy.') + voiceLine + spoke + '</ul>' +
        (done && !Speech.heard ? '<h3>Cách sửa trên iPad</h3><ol>' +
          '<li>Mở trò chơi bằng <b>Safari</b> (không mở bên trong ứng dụng khác).</li>' +
          '<li>Vuốt mở <b>Trung tâm điều khiển</b>, tắt chế độ <b>Im lặng</b> (biểu tượng chuông) và <b>Không làm phiền</b>, rồi tăng âm lượng.</li>' +
          '<li>Vào <b>Cài đặt › Trợ năng › Nội dung được đọc › Giọng nói</b>, chọn <b>Tiếng Việt</b> và tải một giọng (ví dụ Linh).</li>' +
          '<li>Tải lại trang rồi bấm <b>Kiểm tra âm thanh</b> lần nữa.</li></ol>' : '');
    };
    render(false); clearTimeout(this.checkTimer);
    this.checkTimer = setTimeout(() => render(true), 3200);
  },
  soundHelp(show) {
    const msg = 'Chưa nghe thấy tiếng? Hãy tắt chế độ Im lặng của máy, tăng âm lượng, rồi bấm loa lần nữa. Ở trang chính có nút “Kiểm tra âm thanh”.';
    const el = $('#soundHelp'); if (!el) return;
    if (show && (this.helpDismissed || !$('#home').hidden)) return;
    $('#soundHelpText').textContent = msg; el.hidden = !show;
    clearTimeout(this.helpTimer); if (show) this.helpTimer = setTimeout(() => { el.hidden = true; }, 12000);
  },
  unlockAudio() { Sfx.unlock(); Speech.unlock(); },
  updateVoiceNote(failed) {
    const n = $('#voiceNote'); if (!n) return;
    if (failed && !Speech.hasRecordings && !Speech.heard && !(Speech.voicesKnown && !Speech.hasVi) && Speech.supported) { n.textContent = 'Chưa nghe thấy Trâu Con nói? Hãy tăng âm lượng, tắt chế độ im lặng của máy, rồi bấm nút loa lần nữa.'; n.hidden = false; return; }
    if (Speech.hasRecordings) { n.hidden = true; return; }
    if (!Speech.supported) { n.textContent = 'Trình duyệt này chưa đọc được tiếng. Các bạn vẫn chơi được, chỉ là Trâu Con không nói. Hãy thử mở bằng Safari, Chrome hoặc Edge.'; n.hidden = false; return; }
    if (Speech.voicesKnown && !Speech.hasVi) { n.textContent = 'Máy này chưa có giọng đọc tiếng Việt nên Trâu Con chưa nói được. Các bạn vẫn chơi được bình thường. Thầy cô, bố mẹ có thể cài thêm giọng tiếng Việt trong phần cài đặt giọng nói của máy.'; n.hidden = false; return; }
    n.hidden = true;
  },
  renderHome() {
    const best = Store.get('stars', {});
    $('#cards').replaceChildren(...GAME_ORDER.map(id => {
      const g = GAMES[id]; const s = best[id] || 0;
      const icon = typeof ICONS[g.icon] === 'function' ? ICONS[g.icon]('vowel') : ICONS[g.icon];
      return h('button', { class: 'gcard', type: 'button', onclick: () => { this.unlockAudio(); this.go(id); } },
        h('span', { class: 'gicon', html: icon }),
        h('span', { class: 'gnum' }, 'Trò chơi ' + g.num),
        h('span', { class: 'gname' }, g.title),
        h('span', { class: 'gdesc' }, g.desc),
        h('span', { class: 'gstars', 'aria-label': s ? s + ' trên 3 sao' : 'Chưa chơi', html: s ? '★'.repeat(s) + '<span class="off">' + '★'.repeat(3 - s) + '</span>' : '' }));
    }));
  },
  go(id) {
    const url = id ? '#' + id : location.pathname + location.search;
    try { history.pushState(null, '', url); } catch (e) {}
    this.route();
  },
  route() {
    const m = location.hash.match(/^#(g[1-7])(?:-(\d))?$/);
    $('#finish').hidden = true;
    if (m) { Runner.open(m[1], +(m[2] || 0)); return; }
    Runner.clear(); Runner.id = null;
    $('#game').hidden = true; $('#home').hidden = false;
    document.title = 'Trường Tiếng Việt Của Em · Bài 1';
    this.renderHome();
  },
  closeFinish() { $('#finish').hidden = true; },
  init() {
    window.__voiceChanged = () => this.updateVoiceNote();
    $('#heroTrau').innerHTML = trauSVG('wave');
    $('#guideTrau').innerHTML = trauSVG('bob');
    $('#finTrau').innerHTML = trauSVG('wave');
    $('#btnSay').innerHTML = SPEAKER; $('#btnSayHero').innerHTML = SPEAKER;
    $('#soundHelpClose').addEventListener('click', () => { this.helpDismissed = true; $('#soundHelp').hidden = true; });
    window.__speechFail = () => { this.soundHelp(true); this.updateVoiceNote(true); };
    window.__speechOk = () => { this.soundHelp(false); this.updateVoiceNote(); };
    $('#btnStart').addEventListener('click', () => { this.unlockAudio(); this.welcomeNext = true; this.go('g1'); });
    $('#btnCheck').addEventListener('click', () => this.soundCheck());
    $('#btnSayHero').addEventListener('click', e => { this.unlockAudio(); Speech.say(['s:welcome', 's:menu']); bounce(e.currentTarget, 'speaking', 1600); });
    $('#btnSay').addEventListener('click', e => { this.unlockAudio(); Speech.say(UI.guideIds); UI.mascot('nod'); bounce(e.currentTarget, 'speaking', 1600); });
    $('#heroTrau').addEventListener('click', () => { this.unlockAudio(); Speech.say(['s:welcome']); });
    $('#guideTrau').addEventListener('click', () => { this.unlockAudio(); Speech.say(UI.guideIds); UI.mascot('nod'); });
    $('#btnHome').addEventListener('click', () => this.go(''));
    $('#logoLink').addEventListener('click', e => { e.preventDefault(); this.go(''); });
    ['pointerdown', 'pointerup', 'click', 'keydown'].forEach(ev => document.addEventListener(ev, () => this.unlockAudio(), { capture: true, passive: true }));
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#finish').hidden) { this.closeFinish(); } });
    window.addEventListener('popstate', () => this.route());
    this.route();
    setTimeout(() => this.updateVoiceNote(), 1800);
  }
};
App.init();
</script>
